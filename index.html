<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dispensa & Scadenze</title>
  <script type="text/javascript" src="https://unpkg.com/@zxing/library@0.19.1/umd/index.min.js"></script>
  <style>
    :root {
      --bg: #fff7ed;
      --surface: #ffffff;
      --surface-2: #fef3c7;
      --ink: #18181b;
      --muted: #52525b;
      --border: #18181b;
      --green: #4ade80;
      --green-dark: #16a34a;
      --yellow: #facc15;
      --orange: #fb923c;
      --red: #f87171;
      --blue: #60a5fa;
      --shadow: 4px 4px 0px #18181b;
      --shadow-sm: 2px 2px 0px #18181b;
    }

    * {
      box-sizing: border-box;
      font-family: "Trebuchet MS", "Segoe UI Rounded", system-ui, sans-serif;
    }

    html, body {
      width: 100%;
      overflow-x: clip;
    }

    body {
      margin: 0;
      padding: 16px 14px 40px;
      background-color: var(--bg);
      background-image: radial-gradient(#fed7aa 1.5px, transparent 1.5px);
      background-size: 18px 18px;
      color: var(--ink);
      max-width: 720px;
      margin-inline: auto;
    }

    .hero {
      background: var(--yellow);
      border: 3px solid var(--border);
      border-radius: 20px;
      padding: 15px 18px;
      box-shadow: var(--shadow);
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-width: 0;
    }

    .hero h1 {
      margin: 0 0 3px;
      font-size: 1.5rem;
      font-weight: 900;
      letter-spacing: -0.3px;
    }

    .hero p {
      margin: 0;
      font-size: 0.88rem;
      font-weight: 700;
      color: #27272a;
    }

    .badge-box {
      background: var(--surface);
      border: 3px solid var(--border);
      border-radius: 14px;
      padding: 8px 12px;
      font-weight: 900;
      font-size: 0.85rem;
      box-shadow: var(--shadow-sm);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .card {
      background: var(--surface);
      border: 3px solid var(--border);
      border-radius: 20px;
      padding: 16px;
      box-shadow: var(--shadow);
      margin-bottom: 18px;
      min-width: 0;
      overflow-x: clip;
    }

    .section-title {
      margin: 0 0 12px;
      font-size: 1.08rem;
      font-weight: 900;
    }

    label {
      display: block;
      font-size: 0.86rem;
      font-weight: 900;
      margin-bottom: 5px;
      color: var(--ink);
    }

    input, select, button {
      display: block;
      width: 100%;
      min-width: 0;
      max-width: 100%;
      padding: 11px 12px;
      border-radius: 14px;
      border: 2.5px solid var(--border);
      font-size: 0.96rem;
      font-weight: 700;
      margin-bottom: 12px;
      outline: none;
    }

    input[type="range"] {
      padding: 4px 0;
      background: transparent;
      border: none;
      box-shadow: none;
      margin-bottom: 0;
    }

    input[type="date"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      max-width: 100%;
      min-width: 0;
      min-height: 46px;
      line-height: 1.2;
      padding-right: 10px;
    }

    input, select {
      background: #fffbeb;
      color: var(--ink);
      box-shadow: var(--shadow-sm);
    }

    input:focus, select:focus {
      background: #ffffff;
      border-color: #2563eb;
    }

    .row {
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(0, 0.65fr);
      gap: 10px;
      min-width: 0;
    }

    .row-equal {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 10px;
      min-width: 0;
    }

    .row > div, .row-equal > div {
      min-width: 0;
      overflow: hidden;
    }

    button {
      background: var(--green);
      color: var(--ink);
      font-weight: 900;
      border: 2.5px solid var(--border);
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      transition: transform 0.08s ease, box-shadow 0.08s ease;
    }

    button:active {
      transform: translate(2px, 2px);
      box-shadow: 0px 0px 0px var(--border);
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    button.btn-blue { background: var(--blue); }
    button.btn-yellow { background: var(--yellow); }
    button.btn-orange { background: var(--orange); }
    button.btn-red { background: var(--red); }
    button.btn-white { background: var(--surface); }

    button.mini {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      width: auto;
      padding: 6px 10px;
      font-size: 0.84rem;
      border-radius: 11px;
      margin-bottom: 0;
    }

    .photo-picker-row {
      display: flex;
      gap: 8px;
      align-items: stretch;
      margin-bottom: 12px;
    }

    .photo-picker-row input {
      margin-bottom: 0;
      flex: 1 1 auto;
    }

    .camera-icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: auto;
      flex-shrink: 0;
      padding: 0 14px;
      margin-bottom: 0;
      background: var(--yellow);
    }

    .cam-svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    .preview-box {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--surface-2);
      border: 2.5px solid var(--border);
      border-radius: 16px;
      padding: 10px;
      margin-bottom: 14px;
      min-width: 0;
    }

    .preview-thumb {
      width: 64px;
      height: 64px;
      border-radius: 12px;
      border: 2.5px solid var(--border);
      object-fit: cover;
      background: var(--surface);
      flex-shrink: 0;
    }

    .preview-info {
      font-size: 0.84rem;
      font-weight: 700;
      color: var(--muted);
      min-width: 0;
      flex: 1;
    }

    .preview-info strong {
      display: block;
      color: var(--ink);
      font-size: 0.92rem;
      margin-bottom: 2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #cameraSection {
      display: none;
      margin-bottom: 12px;
    }

    #videoContainer {
      position: relative;
      width: 100%;
      border-radius: 16px;
      border: 3px solid var(--border);
      overflow: hidden;
      margin-bottom: 10px;
      background: #18181b;
    }

    #scanGuide {
      position: absolute;
      left: 10%;
      right: 10%;
      top: 50%;
      height: 2px;
      background: rgba(250, 204, 21, 0.85);
      box-shadow: 0 0 8px rgba(0, 0, 0, 0.8);
      pointer-events: none;
      z-index: 2;
    }

    video {
      width: 100%;
      height: 240px;
      object-fit: cover;
      display: block;
      transform-origin: center center;
      transition: transform 0.12s ease-out;
    }

    .zoom-box {
      background: var(--surface-2);
      border: 2.5px solid var(--border);
      border-radius: 14px;
      padding: 10px 12px;
      box-shadow: var(--shadow-sm);
    }

    .zoom-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      font-weight: 900;
      margin-bottom: 6px;
    }

    .zoom-buttons {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }

    .status {
      background: #f4f4f5;
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 8px 12px;
      font-size: 0.85rem;
      font-weight: 800;
      margin-bottom: 12px;
      word-break: break-word;
    }

    .controls-top {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }

    .item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      background: var(--surface);
      border: 2.5px solid var(--border);
      border-left: 8px solid var(--green-dark);
      border-radius: 16px;
      padding: 10px 12px;
      margin-bottom: 12px;
      box-shadow: var(--shadow-sm);
      min-width: 0;
    }

    .item.soon {
      border-left-color: var(--orange);
      background: #fffbeb;
    }

    .item.expired {
      border-left-color: #dc2626;
      background: #fef2f2;
    }

    .item-left {
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 0;
    }

    .item-img {
      width: 56px;
      height: 56px;
      border-radius: 12px;
      border: 2px solid var(--border);
      object-fit: cover;
      background: #f4f4f5;
      flex-shrink: 0;
    }

    .item-title {
      font-weight: 900;
      font-size: 0.98rem;
      word-break: break-word;
    }

    .qty-pill {
      display: inline-block;
      background: var(--yellow);
      border: 2px solid var(--border);
      border-radius: 999px;
      padding: 1px 8px;
      font-size: 0.8rem;
      font-weight: 900;
      margin-left: 4px;
    }

    .item-meta {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--muted);
      margin-top: 3px;
    }

    .item-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      justify-content: flex-end;
      flex-shrink: 0;
    }

    .empty-msg {
      text-align: center;
      padding: 18px 10px;
      font-weight: 800;
      color: var(--muted);
      background: #fafafa;
      border: 2px dashed var(--border);
      border-radius: 14px;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(24, 24, 27, 0.65);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 50;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-card {
      width: 100%;
      max-width: 500px;
      max-height: 90vh;
      overflow-y: auto;
      background: var(--surface);
      border: 3px solid var(--border);
      border-radius: 20px;
      padding: 18px;
      box-shadow: 6px 6px 0px var(--border);
      overflow-x: clip;
    }

    @media (max-width: 560px) {
      .row {
        grid-template-columns: minmax(0, 1fr);
      }
      .item {
        flex-direction: column;
        align-items: stretch;
      }
      .item-actions {
        justify-content: flex-start;
      }
    }
  </style>
</head>
<body>
  <header class="hero">
    <div>
      <h1>Dispensa & Scadenze</h1>
      <p>Scansione codice a barre, categorie estese, foto e scadenze.</p>
    </div>
    <div class="badge-box" id="totalCountBadge">0 pz</div>
  </header>

  <section class="card">
    <h2 class="section-title">Aggiungi prodotto</h2>

    <div class="row-equal">
      <button type="button" id="btnScan" class="btn-blue">Scansiona codice</button>
      <button type="button" id="btnStopScan" class="btn-orange" style="display:none;">Ferma fotocamera</button>
    </div>

    <div id="cameraSection">
      <div id="videoContainer">
        <div id="scanGuide"></div>
        <video id="interactive" autoplay muted playsinline></video>
      </div>

      <div class="zoom-box">
        <div class="zoom-header">
          <label for="zoomSlider" style="margin:0;">Zoom fotocamera</label>
          <span id="zoomValue">1.0x</span>
        </div>
        <input type="range" id="zoomSlider" min="1" max="3" step="0.1" value="1" />
        <div class="zoom-buttons">
          <button type="button" id="zoom1x" class="mini btn-white">1x</button>
          <button type="button" id="zoom2x" class="mini btn-yellow">2x</button>
          <button type="button" id="zoom3x" class="mini btn-yellow">3x</button>
        </div>
      </div>
    </div>

    <div id="statusMsg" class="status">Pronto. Scansiona un codice a barre o compila i campi.</div>

    <div class="preview-box">
      <img id="previewImg" class="preview-thumb" src="" alt="Anteprima prodotto" />
      <div class="preview-info">
        <strong id="previewTitle">Anteprima prodotto</strong>
        <span id="previewSub">Foto automatica da codice a barre oppure scattata con la fotocamera.</span>
      </div>
    </div>

    <form id="productForm">
      <label for="barcode">Codice a barre (EAN / UPC / Code-128)</label>
      <input type="text" id="barcode" autocomplete="off" inputmode="numeric" placeholder="Es. 8001505005822" />

      <label for="name">Nome prodotto</label>
      <input type="text" id="name" required placeholder="Es. Latte parzialmente scremato" />

      <label for="imageUrl">Foto prodotto (automatica, URL o scatto fotocamera)</label>
      <div class="photo-picker-row">
        <input type="text" id="imageUrl" placeholder="Compilata in automatico o scatta una foto..." />
        <button type="button" id="btnTakePhoto" class="camera-icon-btn" title="Scatta foto del prodotto" aria-label="Scatta foto del prodotto">
          <svg class="cam-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
            <circle cx="12" cy="13" r="4"></circle>
          </svg>
          <span>Foto</span>
        </button>
        <input type="file" id="photoFileInput" accept="image/*" capture="environment" style="display:none;" />
      </div>

      <div class="row">
        <div>
          <label for="category">Categoria e prospetto scadenza</label>
          <select id="category"></select>
        </div>

        <div>
          <label for="qty">Quantità</label>
          <input type="number" id="qty" min="1" step="1" value="1" required />
        </div>
      </div>

      <label for="expiry">Data di scadenza (calcolata dal prospetto, modificabile)</label>
      <input type="date" id="expiry" required />

      <button type="submit">Salva prodotto</button>
    </form>
  </section>

  <section class="card">
    <h2 class="section-title">Prodotti in dispensa</h2>

    <input type="search" id="searchInput" placeholder="Cerca per nome, categoria o codice..." />

    <div class="controls-top">
      <button type="button" id="filterAll" class="mini btn-yellow">Tutti (0)</button>
      <button type="button" id="filterUrgent" class="mini btn-white">Scadenza ≤ 3 gg (0)</button>
      <button type="button" id="btnExport" class="mini btn-blue">Esporta</button>
      <button type="button" id="btnImportTrigger" class="mini btn-white">Importa</button>
      <input type="file" id="importFile" accept=".json,application/json" style="display:none;" />
    </div>

    <div id="list"></div>
  </section>

  <div id="editModal" class="modal-backdrop" aria-hidden="true">
    <div class="modal-card">
      <h2 class="section-title">Modifica prodotto</h2>
      <form id="editForm">
        <input type="hidden" id="editId" />

        <label for="editName">Nome prodotto</label>
        <input type="text" id="editName" required />

        <label for="editBarcode">Codice a barre</label>
        <input type="text" id="editBarcode" inputmode="numeric" />

        <label for="editImageUrl">Foto prodotto (URL o scatto fotocamera)</label>
        <div class="photo-picker-row">
          <input type="text" id="editImageUrl" placeholder="https://... oppure scatta una foto" />
          <button type="button" id="btnEditTakePhoto" class="camera-icon-btn" title="Scatta nuova foto" aria-label="Scatta nuova foto">
            <svg class="cam-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
              <circle cx="12" cy="13" r="4"></circle>
            </svg>
            <span>Foto</span>
          </button>
          <input type="file" id="editPhotoFileInput" accept="image/*" capture="environment" style="display:none;" />
        </div>

        <div class="row">
          <div>
            <label for="editCategory">Categoria</label>
            <select id="editCategory"></select>
          </div>
          <div>
            <label for="editQty">Quantità</label>
            <input type="number" id="editQty" min="1" step="1" required />
          </div>
        </div>

        <label for="editExpiry">Data di scadenza</label>
        <input type="date" id="editExpiry" required />

        <div class="row-equal">
          <button type="submit">Salva modifiche</button>
          <button type="button" id="btnCancelEdit" class="btn-white">Annulla</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "dispensa_prodotti_v3";

    const CATEGORY_PROSPECTUS = [
      {
        group: "Surgelati e conserve specifiche",
        items: [
          { name: "Surgelati e gelati", days: 180, tag: "FRZ", keywords: ["surgel", "congelat", "gelato", "sofficini", "bastoncini", "frozen", "ice cream"] },
          { name: "Conserve, passate e sughi", days: 540, tag: "CNS", keywords: ["passata", "pelati", "polpa di pomodoro", "sugo", "pesto", "conserva", "concentrato", "tomato sauce", "pasta sauce"] },
          { name: "Scatolame (tonno, carne, legumi)", days: 730, tag: "SCT", keywords: ["tonno in scatola", "tonno all'olio", "carne in scatola", "fagioli in scatola", "ceci in scatola", "piselli in scatola", "scatola", "canned", "tinned"] },
          { name: "Pasta fresca e gnocchi", days: 15, tag: "PSF", keywords: ["pasta fresca", "gnocchi", "tortellini", "ravioli", "tagliatelle fresche", "fresh pasta"] },
          { name: "Piatti pronti e gastronomia", days: 4, tag: "GAS", keywords: ["piatto pronto", "piatti pronti", "gastronomia", "insalatona", "tramezzino", "lasagna", "ready meal"] }
        ]
      },
      {
        group: "Freschi e deperibili",
        items: [
          { name: "Pesce fresco e frutti di mare", days: 3, tag: "PSC", keywords: ["pesce", "salmone", "orata", "branzino", "spigola", "gamber", "cozze", "vongole", "seppie", "calamari", "fish", "salmon", "shrimp", "seafood"] },
          { name: "Carne fresca", days: 4, tag: "CRN", keywords: ["carne", "manzo", "vitello", "maiale", "pollo", "tacchino", "agnello", "salsiccia", "wurstel", "meat", "beef", "pork", "chicken", "turkey", "poultry"] },
          { name: "Affettati e salumi", days: 7, tag: "SAL", keywords: ["prosciutto", "salame", "mortadella", "bresaola", "coppa", "speck", "affettat", "salumi", "ham", "salami"] },
          { name: "Formaggi", days: 45, tag: "FRG", keywords: ["formagg", "mozzarella", "ricotta", "stracchino", "mascarpone", "caciotta", "pecorino", "grana", "parmigiano", "gorgonzola", "cheese"] },
          { name: "Latticini freschi", days: 10, tag: "LAT", keywords: ["latte", "latticini", "yogurt", "yoghurt", "panna", "kefir", "budino", "milk", "dairy", "cream"] },
          { name: "Uova", days: 21, tag: "UOV", keywords: ["uova", "uovo", "eggs", "egg"] },
          { name: "Verdura e ortaggi freschi", days: 6, tag: "VRD", keywords: ["verdura", "ortagg", "insalata", "pomodor", "patat", "zucchin", "melanzan", "carot", "peperon", "spinac", "vegetable", "salad", "tomato", "potato"] },
          { name: "Frutta fresca", days: 7, tag: "FRT", keywords: ["frutta", "mela", "mele", "banana", "banane", "arancia", "arance", "limone", "limoni", "fragol", "pesca", "pesche", "pera", "pere", "uva", "kiwi", "fruit", "apple", "banana", "orange", "lemon"] },
          { name: "Pane e prodotti da forno freschi", days: 5, tag: "PAN", keywords: ["pane", "focaccia", "pizza fresca", "cornetto", "brioche", "panini", "piadina", "bread", "bakery", "pastry"] }
        ]
      },
      {
        group: "Dispensa secca e condimenti",
        items: [
          { name: "Pasta, riso e cereali", days: 365, tag: "PST", keywords: ["pasta", "spaghetti", "penne", "fusilli", "rigatoni", "riso", "farro", "orzo", "couscous", "avena", "cereali", "rice", "cereal", "oat"] },
          { name: "Farine, lieviti e preparati", days: 270, tag: "FAR", keywords: ["farina", "lievito", "amido", "fecola", "pangrattato", "preparato per", "flour", "yeast", "baking"] },
          { name: "Legumi e cereali secchi", days: 540, tag: "LEG", keywords: ["lenticchi", "ceci", "fagioli", "piselli", "legumi", "beans", "lentils", "chickpeas", "peas"] },
          { name: "Sottaceti, sottoli e olive", days: 365, tag: "OLI", keywords: ["olive", "sottacet", "sottol", "capperi", "carciof", "cetriolin", "pickles", "olives"] },
          { name: "Condimenti, oli, aceti e spezie", days: 540, tag: "CND", keywords: ["olio", "aceto", "sale", "pepe", "spezi", "origano", "basilico", "maionese", "senape", "ketchup", "dado", "oil", "vinegar", "spice", "condiment"] },
          { name: "Biscotti, merendine e snack dolci", days: 120, tag: "DOL", keywords: ["biscott", "frollin", "merendin", "wafer", "croissant", "plumcake", "cookie", "biscuit", "cake"] },
          { name: "Snack salati, patatine e frutta secca", days: 150, tag: "SNK", keywords: ["patatine", "cracker", "grissin", "tarall", "salatini", "arachid", "mandorl", "noci", "nocciole", "pistacch", "chips", "crackers", "nuts"] },

    function createConfiguredCodeReader() {
      const hints = new Map();
      if (typeof ZXing !== "undefined" && ZXing.BarcodeFormat && ZXing.DecodeHintType) {
        hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [
          ZXing.BarcodeFormat.EAN_13,
          ZXing.BarcodeFormat.EAN_8,
          ZXing.BarcodeFormat.UPC_A,
          ZXing.BarcodeFormat.UPC_E,
          ZXing.BarcodeFormat.CODE_128,
          ZXing.BarcodeFormat.QR_CODE
        ]);
        hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
      }
      return new ZXing.BrowserMultiFormatReader(hints, 250);
    }

    function isPlausibleBarcode(rawText, format) {
      const text = String(rawText || "").trim();
      if (!text) return false;
      // I codici a barre commerciali standard (EAN-8, EAN-13, UPC) hanno almeno 8 cifre
      if (/^\d+$/.test(text)) {
        return text.length >= 8 && text.length <= 14;
      }
      // Per Code-128 o QR accetta solo stringhe di almeno 6 caratteri
      return text.length >= 6;
    }

    function sanitizeImageUrl(rawUrl) {
      const trimmed = String(rawUrl || "").trim();
      if (!trimmed) return "";
      if (/^data:image\/(jpeg|jpg|png|webp);base64,[A-Za-z0-9+/=]+$/i.test(trimmed)) {
        return trimmed;
      }
      try {
        const parsed = new URL(trimmed);
        if (parsed.protocol === "https:" || parsed.protocol === "http:") {
          return parsed.href;
        }
      } catch {}
      return "";
    }

    function compressPhotoFileToDataUrl(file, maxSize = 480, quality = 0.72) {
      return new Promise((resolve, reject) => {
        if (!file || !file.type.startsWith("image/")) {
          reject(new Error("File immagine non valido"));
          return;
        }
        const reader = new FileReader();
        reader.onload = () => {
          const img = new Image();
          img.onload = () => {
            let { width, height } = img;
            if (width > maxSize || height > maxSize) {
              if (width >= height) {
                height = Math.round((height * maxSize) / width);
                width = maxSize;
              } else {
                width = Math.round((width * maxSize) / height);
                height = maxSize;
              }
            }
            const canvas = document.createElement("canvas");
            canvas.width = Math.max(1, width);
            canvas.height = Math.max(1, height);
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL("image/jpeg", quality));
          };
          img.onerror = () => reject(new Error("Impossibile leggere l'immagine"));
          img.src = reader.result;
        };
        reader.onerror = () => reject(new Error("Errore caricamento file"));
        reader.readAsDataURL(file);
      });
    }

      return "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg);
    }

    function setupZoomControlsForTrack(track) {
      currentVideoTrack = track || null;
      hardwareZoomSupported = false;
      els.zoomSlider.min = "1";

      if (track && typeof track.getCapabilities === "function") {
        try {
          const caps = track.getCapabilities();
          if (caps && typeof caps.zoom === "object" && caps.zoom !== null) {
            const minZ = Number(caps.zoom.min) || 1;
            const maxZ = Math.min(Number(caps.zoom.max) || 3, 6);
            const stepZ = Number(caps.zoom.step) || 0.1;
            if (maxZ > minZ) {
              hardwareZoomSupported = true;
              els.zoomSlider.min = String(minZ);
              els.zoomSlider.max = String(maxZ);
              els.zoomSlider.step = String(stepZ);
              els.zoomSlider.value = String(minZ);
              els.zoomValue.textContent = `${Number(minZ).toFixed(1)}x`;
            }
          }
        } catch {}
      }
    }

    async function applyZoomLevel(level) {
      const minZ = Number(els.zoomSlider.min) || 1;
      const maxZ = Number(els.zoomSlider.max) || 3;
      const clamped = Math.max(minZ, Math.min(maxZ, Number(level) || 1));

      els.zoomSlider.value = String(clamped);
      els.zoomValue.textContent = `${clamped.toFixed(1)}x`;

      if (hardwareZoomSupported && currentVideoTrack && typeof currentVideoTrack.applyConstraints === "function") {
        try {
          await currentVideoTrack.applyConstraints({ advanced: [{ zoom: clamped }] });
          els.video.style.transform = "scale(1)";
          return;
        } catch {}
      }
      els.video.style.transform = `scale(${clamped})`;
    }

    function formatLocalDate(dateObj) {
      const y = dateObj.getFullYear();
      const m = String(dateObj.getMonth() + 1).padStart(2, "0");
      const d = String(dateObj.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    }

    function isValidDateString(str) {
      if (typeof str !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(str)) return false;
      const [y, m, d] = str.split("-").map(Number);
      const dt = new Date(y, m - 1, d);
      return dt.getFullYear() === y && dt.getMonth() === m - 1 && dt.getDate() === d;
    }

    function addDaysToToday(days) {
      const d = new Date();
      d.setHours(12, 0, 0, 0);
      d.setDate(d.getDate() + Number(days));
      return formatLocalDate(d);
    }

    function getDaysForCategory() {
      const [, days] = els.category.value.split("|");
      return Number(days) || 14;
    }

    function updateEstimatedExpiry() {
      els.expiry.value = addDaysToToday(getDaysForCategory());
      updatePreviewBox();

    function inferCategoryFromProduct(categoriesData = "", productText = "") {
      const rawCat = Array.isArray(categoriesData) ? categoriesData.join(" ") : String(categoriesData);
      const combined = `${rawCat} ${String(productText)}`.toLowerCase();

      for (const item of FLAT_CATEGORIES) {
        if (!item.keywords || !item.keywords.length) continue;
        if (item.keywords.some((kw) => combined.includes(kw.toLowerCase()))) {
          return `${item.name}|${item.days}`;
        }
      }
      return null;
    }

    async function lookupBarcode(code, force = false) {
      const clean = String(code || "").trim();
      if (!clean) return;
      if (isLookingUp) return;
      if (!force && clean === lastLookedUpCode) return;

      isLookingUp = true;
      lastLookedUpCode = clean;
      setStatus(`Ricerca codice ${clean} su Open Food Facts...`);
      try {
        const res = await fetch(`https://world.openfoodfacts.org/api/v0/product/${encodeURIComponent(clean)}.json`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        if (data && data.status === 1 && data.product) {
          const p = data.product;
          const productName = p.product_name_it || p.product_name || p.brands || "";
          const genericName = p.generic_name_it || p.generic_name || "";
          const photo = sanitizeImageUrl(p.image_front_url || p.image_front_small_url || p.image_url || "");

          if (productName) els.name.value = productName;
          if (photo) els.imageUrl.value = photo;

          const inferred = inferCategoryFromProduct(
            p.categories || p.categories_tags || "",
            `${productName} ${genericName}`
          );
          if (inferred) {
            els.category.value = inferred;
          }

          updateEstimatedExpiry();
          updatePreviewBox();
          const [catName, catDays] = els.category.value.split("|");
          setStatus(`Trovato: ${productName || "Prodotto"} · Categoria: ${catName} (+${catDays} gg).`);
        } else {
          updateEstimatedExpiry();
          updatePreviewBox();
          setStatus(`Codice ${clean} non presente nel database: inserisci nome e foto.`);
        }
      } catch {
        updateEstimatedExpiry();
        updatePreviewBox();
        setStatus("Errore di rete durante la ricerca: scadenza stimata impostata.");
      } finally {
        isLookingUp = false;
      }
    }

    async function startScanner() {
      if (isScanning || isStartingScan) return;
      if (typeof ZXing === "undefined") {
        setStatus("Libreria scanner non caricata: ricarica la pagina con connessione attiva.");
        return;
      }
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        setStatus("Fotocamera non disponibile su questo contesto (serve HTTPS).");
        return;
      }

      isStartingScan = true;
      els.btnScan.disabled = true;

      if (codeReader) {
        try { codeReader.reset(); } catch {}
      }
      codeReader = createConfiguredCodeReader();

      els.cameraSection.style.display = "block";
      els.btnStopScan.style.display = "block";
      setStatus("Avvio fotocamera in corso...");

      const currentSession = ++scanSessionId;
      const startedAt = Date.now();
      let hasDecoded = false;

      // Imposta subito isScanning = true prima di avviare il stream di decodifica
      isScanning = true;

      try {
        await codeReader.decodeFromConstraints(
          {
            audio: false,
            video: {
              facingMode: { ideal: "environment" },
              width: { ideal: 1280 },
              height: { ideal: 720 }
            }
          },
          els.video,
          async (result, err) => {
            if (!isScanning || hasDecoded || currentSession !== scanSessionId) return;

            // Attendi 600ms di stabilizzazione autofocus/esposizione prima di accettare letture
            if (Date.now() - startedAt < 600) return;

            if (result) {
              const scannedText = String(result.getText() || "").trim();
              const format = typeof result.getBarcodeFormat === "function" ? result.getBarcodeFormat() : null;
              if (!isPlausibleBarcode(scannedText, format)) {
                return;
              }

              hasDecoded = true;
              await stopScanner();
              els.barcode.value = scannedText;
              await lookupBarcode(scannedText, true);
            } else if (err && err.name !== "NotFoundException") {
              // Ignora errori transitori sui singoli fotogrammi
            }
          }
        );

        if (!isScanning || currentSession !== scanSessionId) {
          await stopScanner();
          return;
        }

        const stream = els.video && els.video.srcObject;
        const videoTrack = stream && typeof stream.getVideoTracks === "function"
          ? stream.getVideoTracks()[0]
          : null;
        setupZoomControlsForTrack(videoTrack);

        setStatus("Fotocamera attiva: allinea il codice a barre alla linea gialla.");
      } catch (err) {
        const reason = err && (err.name || err.message) ? ` (${err.name || err.message})` : "";
        setStatus(`Fotocamera non avviata${reason}.`);
        await stopScanner();
      } finally {
        isStartingScan = false;
        els.btnScan.disabled = false;
      }
    }

    async function stopScanner() {
      scanSessionId++;
      isScanning = false;
      isStartingScan = false;
      currentVideoTrack = null;
      hardwareZoomSupported = false;
      els.video.style.transform = "scale(1)";

      if (codeReader) {
        try { codeReader.reset(); } catch {}
      }
      if (els.video && els.video.srcObject) {
        try {
          els.video.srcObject.getTracks().forEach((t) => t.stop());
          els.video.srcObject = null;
        } catch {}
      }
      els.cameraSection.style.display = "none";
      els.btnStopScan.style.display = "none";
      els.btnScan.disabled = false;
    }

    document.addEventListener("visibilitychange", () => {
      if (document.hidden && (isScanning || isStartingScan)) {
        stopScanner();
      }
    });

    function normalizeItem(raw) {
      if (!raw || typeof raw !== "object") return null;
      const name = String(raw.name || "").trim();
      if (!name) return null;
      const categoryName = String(raw.categoryName || "Altro / Generico").trim() || "Altro / Generico";
      const meta = getCategoryMeta(categoryName);
      const expiry = isValidDateString(raw.expiry) ? raw.expiry : addDaysToToday(meta.days);
      const imageUrl = sanitizeImageUrl(raw.imageUrl);
      return {
        id: String(raw.id || `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`),
        barcode: String(raw.barcode || "").trim(),
        name,
        imageUrl,
        categoryName,
        qty: Math.max(1, Math.floor(Number(raw.qty) || 1)),
        expiry
      };
    }

    function loadItems() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return memoryFallback.slice();
        const parsed = JSON.parse(raw);
        if (!Array.isArray(parsed)) return memoryFallback.slice();
        const cleaned = parsed.map(normalizeItem).filter(Boolean);
        memoryFallback = cleaned.slice();
        return cleaned;
      } catch {
        return memoryFallback.slice();
      }
    }

    function saveItems(items, successMessage = "") {
      const cleaned = items.map(normalizeItem).filter(Boolean);
      memoryFallback = cleaned.slice();
      let persisted = true;
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(cleaned));
      } catch {
        persisted = false;
      }
      renderList();
      if (!persisted) {
        setStatus("Memoria locale bloccata (spazio esaurito o navigazione privata): dati tenuti in sessione.");
      } else if (successMessage) {
        setStatus(successMessage);
      }
    }

    function daysUntil(dateStr) {
      if (!isValidDateString(dateStr)) return 9999;
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const [y, m, d] = dateStr.split("-").map(Number);
      const target = new Date(y, m - 1, d);
      return Math.round((target.getTime() - today.getTime()) / (1000 * 60 * 60 * 24));
    }

    function setFilter(mode) {
      activeFilter = mode;
      els.filterAll.className = mode === "all" ? "mini btn-yellow" : "mini btn-white";
      els.filterUrgent.className = mode === "urgent" ? "mini btn-orange" : "mini btn-white";
      renderList();
    }

    function renderList() {
      const allItems = loadItems().sort((a, b) => {
        const byExpiry = a.expiry.localeCompare(b.expiry);
        return byExpiry !== 0 ? byExpiry : a.name.localeCompare(b.name, "it");
      });

      const totalPieces = allItems.reduce((sum, item) => sum + item.qty, 0);
      els.totalCountBadge.textContent = `${totalPieces} pz`;

      const urgentCount = allItems.filter((item) => daysUntil(item.expiry) <= 3).length;
      els.filterAll.textContent = `Tutti (${allItems.length})`;
      els.filterUrgent.textContent = `Scadenza ≤ 3 gg (${urgentCount})`;

      const query = els.searchInput.value.trim().toLowerCase();
      const filtered = allItems.filter((item) => {
        const diff = daysUntil(item.expiry);
        if (activeFilter === "urgent" && diff > 3) return false;
        if (query) {
          const matchName = item.name.toLowerCase().includes(query);
          const matchCat = item.categoryName.toLowerCase().includes(query);
          const matchCode = (item.barcode || "").toLowerCase().includes(query);
          if (!matchName && !matchCat && !matchCode) return false;
        }
        return true;
      });

      if (!filtered.length) {
        els.list.innerHTML = allItems.length
          ? "<div class='empty-msg'>Nessun prodotto corrisponde ai filtri selezionati.</div>"
          : "<div class='empty-msg'>Nessun prodotto registrato in dispensa.</div>";
        return;
      }

      els.list.innerHTML = filtered.map((item) => {
        const diff = daysUntil(item.expiry);
        let cls = "";
        let label = `Scade tra ${diff} gg (${item.expiry})`;
        if (diff < 0) {
          cls = "expired";
          label = `Scaduto da ${Math.abs(diff)} gg (${item.expiry})`;
        } else if (diff <= 3) {
          cls = "soon";
          label = diff === 0 ? `Scade oggi (${item.expiry})` : `Scade tra ${diff} gg (${item.expiry})`;
        }

        const imgSrc = item.imageUrl ? escapeHtml(item.imageUrl) : fallbackCategoryImage(item.categoryName);
        const safeId = escapeHtml(item.id);

        return `
          <div class="item ${cls}">
            <div class="item-left">
              <img class="item-img" data-category="${escapeHtml(item.categoryName)}" src="${imgSrc}" alt="${escapeHtml(item.name)}" />
              <div>
                <div class="item-title">
                  ${escapeHtml(item.name)}
                  <span class="qty-pill">x${item.qty}</span>
                </div>
                <div class="item-meta">${escapeHtml(item.categoryName)} · ${label}</div>
              </div>
            </div>
            <div class="item-actions">
              <button type="button" class="mini btn-blue" title="Aumenta quantità" data-action="inc" data-id="${safeId}">+1</button>
              <button type="button" class="mini btn-white" title="Diminuisci quantità" data-action="dec" data-id="${safeId}">-1</button>
              <button type="button" class="mini btn-yellow" data-action="edit" data-id="${safeId}">Modifica</button>
              <button type="button" class="mini btn-red" data-action="delete" data-id="${safeId}">Elimina</button>
            </div>
          </div>
        `;
      }).join("");
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, (m) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[m]));
    }

    function changeQty(id, delta) {
      const items = loadItems().map((item) => {
        if (item.id === id) {
          const nextQty = item.qty + delta;
          return nextQty > 0 ? { ...item, qty: nextQty } : null;
        }
        return item;
      }).filter(Boolean);
      saveItems(items);
    }

    function deleteItem(id) {
      const target = loadItems().find((item) => item.id === id);
      if (target && !window.confirm(`Eliminare "${target.name}" dalla dispensa?`)) {
        return;
      }
      saveItems(loadItems().filter((item) => item.id !== id), "Prodotto rimosso.");
    }

    function ensureEditCategoryOption(catName) {
      const exists = Array.from(els.editCategory.options).some((opt) => opt.value === catName);
      if (!exists) {
        const opt = document.createElement("option");
        opt.value = catName;
        opt.textContent = catName;
        els.editCategory.appendChild(opt);
      }
      els.editCategory.value = catName;
    }

    function openEditModal(id) {
      const item = loadItems().find((i) => i.id === id);
      if (!item) return;

      els.editId.value = item.id;
      els.editName.value = item.name;
      els.editBarcode.value = item.barcode || "";
      els.editImageUrl.value = item.imageUrl || "";
      ensureEditCategoryOption(item.categoryName);
      els.editQty.value = item.qty;
      els.editExpiry.value = item.expiry;

      els.editModal.classList.add("open");
      els.editModal.setAttribute("aria-hidden", "false");
    }

    els.list.addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-action][data-id]");
      if (!btn) return;
      const { action, id } = btn.dataset;
      if (action === "inc") changeQty(id, 1);
      else if (action === "dec") changeQty(id, -1);
      else if (action === "edit") openEditModal(id);
      else if (action === "delete") deleteItem(id);
    });

    function closeEditModal() {
      els.editModal.classList.remove("open");
      els.editModal.setAttribute("aria-hidden", "true");
    }

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && els.editModal.classList.contains("open")) {
        closeEditModal();
      }
    });

    els.btnCancelEdit.addEventListener("click", closeEditModal);
    els.editModal.addEventListener("click", (e) => {
      if (e.target === els.editModal) closeEditModal();
    });

    els.editForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const id = els.editId.value;
      const updated = normalizeItem({
        id,
        name: els.editName.value.trim(),
        barcode: els.editBarcode.value.trim(),
        imageUrl: els.editImageUrl.value.trim(),
        categoryName: els.editCategory.value,
        qty: Math.max(1, Math.floor(Number(els.editQty.value) || 1)),
        expiry: els.editExpiry.value
      });

      if (!updated) return;

      const items = loadItems().map((item) => (item.id === id ? updated : item));
      saveItems(items, `Aggiornato: ${updated.name}.`);
      closeEditModal();
    });

    els.btnScan.addEventListener("click", startScanner);
    els.btnStopScan.addEventListener("click", stopScanner);
    els.category.addEventListener("change", updateEstimatedExpiry);
    els.name.addEventListener("input", updatePreviewBox);
    els.imageUrl.addEventListener("input", updatePreviewBox);
    els.barcode.addEventListener("change", () => {
      const code = els.barcode.value.trim();
      if (code) lookupBarcode(code);
    });
    els.searchInput.addEventListener("input", renderList);
    els.filterAll.addEventListener("click", () => setFilter("all"));
    els.filterUrgent.addEventListener("click", () => setFilter("urgent"));

    els.form.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (isScanning || isStartingScan) {
        await stopScanner();
      }

      const typedCode = els.barcode.value.trim();
      if (typedCode && !els.name.value.trim() && typedCode !== lastLookedUpCode) {
        await lookupBarcode(typedCode, true);
      }

      const productName = els.name.value.trim();
      if (!productName) {
        setStatus("Inserisci un nome prodotto prima di salvare.");
        return;
      }

      const [categoryName] = els.category.value.split("|");
      const expiryValue = isValidDateString(els.expiry.value)
        ? els.expiry.value
        : addDaysToToday(getDaysForCategory());

      const newItem = normalizeItem({
        id: (typeof crypto !== "undefined" && crypto.randomUUID)
          ? crypto.randomUUID()
          : `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
        barcode: typedCode,
        name: productName,
        imageUrl: els.imageUrl.value.trim(),
        categoryName,
        qty: Math.max(1, Math.floor(Number(els.qty.value) || 1)),
        expiry: expiryValue
      });

      const items = loadItems();
      items.push(newItem);

      const savedCategoryVal = els.category.value;
      els.form.reset();
      els.barcode.value = "";
      els.imageUrl.value = "";
      lastLookedUpCode = "";
      els.category.value = savedCategoryVal;
      els.qty.value = 1;
      updateEstimatedExpiry();
      updatePreviewBox();

      saveItems(items, `Salvato: ${newItem.name} (x${newItem.qty}).`);
    });

    els.btnExport.addEventListener("click", () => {
      const blob = new Blob([JSON.stringify(loadItems(), null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `dispensa-backup-${formatLocalDate(new Date())}.json`;
      a.click();
      URL.revokeObjectURL(url);
    });

    els.btnImportTrigger.addEventListener("click", () => els.importFile.click());
    els.importFile.addEventListener("change", async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      try {
        const text = await file.text();
        const parsed = JSON.parse(text);
        if (Array.isArray(parsed)) {
          const validItems = parsed.map(normalizeItem).filter(Boolean);
          saveItems(validItems, `Backup importato (${validItems.length} prodotti).`);
        } else {
          setStatus("File di backup non valido.");
        }
      } catch {
        setStatus("File di backup non valido.");
      }
      e.target.value = "";
    });

    populateCategorySelects();
    updateEstimatedExpiry();
    updatePreviewBox();
    renderList();
  </script>
</body>
</html>
