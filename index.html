<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dispensa & Scadenze</title>
  <script type="text/javascript" src="https://unpkg.com/@zxing/library@0.19.1/umd/index.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card-2: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #22c55e;
      --accent-hover: #16a34a;
      --warn: #f59e0b;
      --danger: #ef4444;
      --border: #475569;
    }

    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      margin: 0;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      max-width: 680px;
      margin-inline: auto;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 1.5rem;
    }

    .subtitle {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 18px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 6px;
    }

    input, select, button {
      width: 100%;
      padding: 11px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      font-size: 1rem;
      margin-bottom: 12px;
    }

    input, select {
      background: var(--bg);
      color: var(--text);
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    button {
      background: var(--accent);
      color: #052e16;
      font-weight: 700;
      border: none;
      cursor: pointer;
    }

    button:hover {
      background: var(--accent-hover);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    button.secondary {
      background: var(--card-2);
      color: var(--text);
      border: 1px solid var(--border);
    }

    button.danger {
      background: var(--danger);
      color: #fff;
    }

    button.small {
      width: auto;
      padding: 6px 10px;
      font-size: 0.85rem;
      margin-bottom: 0;
    }

    button.filter-btn {
      width: auto;
      padding: 8px 12px;
      font-size: 0.85rem;
      margin-bottom: 0;
      background: var(--bg);
      color: var(--muted);
      border: 1px solid var(--border);
    }

    button.filter-btn.active {
      background: var(--accent);
      color: #052e16;
      border-color: var(--accent);
    }

    button.filter-btn.urgent.active {
      background: var(--warn);
      color: #1c1917;
      border-color: var(--warn);
    }

    #videoContainer {
      position: relative;
      width: 100%;
      min-height: 220px;
      max-height: 300px;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 12px;
      display: none;
      background: #000;
    }

    video {
      width: 100%;
      height: 240px;
      object-fit: cover;
      display: block;
    }

    .status {
      font-size: 0.85rem;
      color: var(--muted);
      min-height: 18px;
      margin-bottom: 10px;
    }

    .item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-left: 6px solid var(--accent);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
    }

    .item.soon {
      border-left-color: var(--warn);
    }

    .item.expired {
      border-left-color: var(--danger);
    }

    .item-title {
      font-weight: 700;
      font-size: 1rem;
    }

    .item-meta {
      font-size: 0.82rem;
      color: var(--muted);
      margin-top: 4px;
    }

    .actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .toolbar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px;
      align-items: center;
    }

    .filter-bar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    #searchInput {
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <h1>Dispensa & Scadenze</h1>
  <div class="subtitle">Archivio locale sul dispositivo con scansione EAN, Open Food Facts e stima scadenza.</div>

  <div class="card">
    <div class="row">
      <button type="button" id="btnScan" class="secondary">Scansiona Codice</button>
      <button type="button" id="btnStopScan" class="secondary" style="display:none;">Ferma Fotocamera</button>
    </div>

    <div id="videoContainer">
      <video id="interactive" autoplay muted playsinline></video>
    </div>

    <div id="statusMsg" class="status">Pronto. Puoi scansionare un codice a barre o inserire i dati a mano.</div>

    <form id="productForm">
      <label for="barcode">Codice a barre (EAN)</label>
      <input type="text" id="barcode" autocomplete="off" inputmode="numeric" placeholder="Es. 8001505005822" />

      <label for="name">Nome prodotto</label>
      <input type="text" id="name" required placeholder="Es. Latte fresco intero" />

      <div class="row">
        <div>
          <label for="category">Categoria (stima giorni)</label>
          <select id="category">
            <option value="Latticini|10">Latticini (+10 gg)</option>
            <option value="Carne/Pesce|4">Carne / Pesce (+4 gg)</option>
            <option value="Verdura Fresca|6">Verdura Fresca (+6 gg)</option>
            <option value="Pasta/Riso|365">Pasta / Riso (+365 gg)</option>
            <option value="Scatolame|730">Scatolame (+730 gg)</option>
            <option value="Surgelati|180">Surgelati (+180 gg)</option>
            <option value="Bevande|90">Bevande (+90 gg)</option>
            <option value="Altro|14">Altro (+14 gg)</option>
          </select>
        </div>

        <div>
          <label for="qty">Quantità</label>
          <input type="number" id="qty" min="1" step="1" value="1" required />
        </div>
      </div>

      <label for="expiry">Data di scadenza (calcolata in automatico, modificabile)</label>
      <input type="date" id="expiry" required />

      <button type="submit">Salva in Dispensa</button>
    </form>
  </div>

  <div class="card">
    <input type="search" id="searchInput" placeholder="Cerca prodotto o categoria..." />

    <div class="filter-bar">
      <button type="button" id="filterAll" class="filter-btn active">Tutti (0)</button>
      <button type="button" id="filterUrgent" class="filter-btn urgent">In scadenza ≤ 3 gg (0)</button>
    </div>

    <div class="toolbar">
      <button type="button" id="btnExport" class="secondary small">Esporta Backup</button>
      <button type="button" id="btnImportTrigger" class="secondary small">Importa Backup</button>
      <input type="file" id="importFile" accept=".json,application/json" style="display:none;" />
    </div>

    <div id="list"></div>
  </div>

  <script>
    const STORAGE_KEY = "dispensa_prodotti_v1";
    let memoryFallback = [];
    let codeReader = null;
    let isScanning = false;
    let isStartingScan = false;
    let activeFilter = "all";

    const els = {
      btnScan: document.getElementById("btnScan"),
      btnStopScan: document.getElementById("btnStopScan"),
      videoContainer: document.getElementById("videoContainer"),
      video: document.getElementById("interactive"),
      statusMsg: document.getElementById("statusMsg"),
      form: document.getElementById("productForm"),
      barcode: document.getElementById("barcode"),
      name: document.getElementById("name"),
      category: document.getElementById("category"),
      qty: document.getElementById("qty"),
      expiry: document.getElementById("expiry"),
      searchInput: document.getElementById("searchInput"),
      filterAll: document.getElementById("filterAll"),
      filterUrgent: document.getElementById("filterUrgent"),
      list: document.getElementById("list"),
      btnExport: document.getElementById("btnExport"),
      btnImportTrigger: document.getElementById("btnImportTrigger"),
      importFile: document.getElementById("importFile")
    };

    function setStatus(msg) {
      els.statusMsg.textContent = msg;
    }

    function formatLocalDate(dateObj) {
      const year = dateObj.getFullYear();
      const month = String(dateObj.getMonth() + 1).padStart(2, "0");
      const day = String(dateObj.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function isValidDateString(str) {
      if (typeof str !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(str)) return false;
      const [y, m, d] = str.split("-").map(Number);
      const dt = new Date(y, m - 1, d);
      return dt.getFullYear() === y && dt.getMonth() === m - 1 && dt.getDate() === d;
    }

    function addDaysToToday(days) {
      const d = new Date();
      d.setHours(12, 0, 0, 0);
      d.setDate(d.getDate() + Number(days));
      return formatLocalDate(d);
    }

    function getDaysForCategory() {
      const [, days] = els.category.value.split("|");
      return Number(days) || 14;
    }

    function updateEstimatedExpiry() {
      els.expiry.value = addDaysToToday(getDaysForCategory());
    }

    function inferCategoryFromOFF(categoriesText = "") {
      const txt = String(categoriesText).toLowerCase();
      if (/\b(milk|dairy|yogurt|cheese|latte|formaggio|burro|panna)\b/.test(txt)) {
        return "Latticini|10";
      }
      if (/\b(meat|fish|poultry|carne|pesce|pollo|salumi|affettati)\b/.test(txt)) {
        return "Carne/Pesce|4";
      }
      if (/\b(vegetable|fruit|verdura|frutta|ortaggi|insalata)\b/.test(txt)) {
        return "Verdura Fresca|6";
      }
      if (/\b(pasta|rice|riso|cereali|farina)\b/.test(txt)) {
        return "Pasta/Riso|365";
      }
      if (/\b(canned|conserv|scatola|tonno|pomodoro|legumi)\b/.test(txt)) {
        return "Scatolame|730";
      }
      if (/\b(frozen|surgel|gelo)\b/.test(txt)) {
        return "Surgelati|180";
      }
      if (/\b(beverage|water|juice|bevande|acqua|succo|bibite)\b/.test(txt)) {
        return "Bevande|90";
      }
      return null;
    }

    async function lookupBarcode(code) {
      const clean = String(code || "").trim();
      if (!clean) return;
      setStatus(`Ricerca codice ${clean} su Open Food Facts...`);
      try {
        const res = await fetch(`https://world.openfoodfacts.org/api/v0/product/${encodeURIComponent(clean)}.json`);
        if (!res.ok) {
          throw new Error(`HTTP ${res.status}`);
        }
        const data = await res.json();
        if (data && data.status === 1 && data.product) {
          const p = data.product;
          const productName = p.product_name_it || p.product_name || p.brands || "";
          if (productName) {
            els.name.value = productName;
          }
          const inferred = inferCategoryFromOFF(p.categories || p.categories_tags || "");
          if (inferred) {
            els.category.value = inferred;
          }
          updateEstimatedExpiry();
          setStatus(`Trovato: ${productName || "Prodotto"} - scadenza stimata aggiornata.`);
        } else {
          updateEstimatedExpiry();
          setStatus("Codice non trovato su Open Food Facts: inserisci il nome manualmente.");
        }
      } catch (err) {
        updateEstimatedExpiry();
        setStatus("Errore di rete durante la ricerca: scadenza stimata impostata.");
      }
    }

    async function startScanner() {
      if (isScanning || isStartingScan) return;
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        setStatus("Questo browser non espone l'accesso alla fotocamera (serve HTTPS).");
        return;
      }

      isStartingScan = true;
      els.btnScan.disabled = true;

      if (!codeReader) {
        codeReader = new ZXing.BrowserMultiFormatReader();
      } else {
        try {
          codeReader.reset();
        } catch (e) {}
      }

      els.videoContainer.style.display = "block";
      els.btnStopScan.style.display = "block";
      setStatus("Richiesta fotocamera in corso...");

      const constraints = {
        audio: false,
        video: {
          facingMode: { ideal: "environment" }
        }
      };

      try {
        await codeReader.decodeFromConstraints(
          constraints,
          els.video,
          async (result, err) => {
            if (!isScanning) return;
            if (result) {
              const scannedText = result.getText();
              await stopScanner();
              els.barcode.value = scannedText;
              await lookupBarcode(scannedText);
            } else if (err && err.name !== "NotFoundException") {
              console.warn(err);
            }
          }
        );
        isScanning = true;
        setStatus("Fotocamera attiva: inquadra il codice a barre.");
      } catch (err) {
        const reason = err && (err.name || err.message) ? ` (${err.name || err.message})` : "";
        setStatus(`Fotocamera non avviata${reason}. Controlla i permessi del browser.`);
        await stopScanner();
      } finally {
        isStartingScan = false;
        els.btnScan.disabled = false;
      }
    }

    async function stopScanner() {
      isScanning = false;
      if (codeReader) {
        try {
          codeReader.reset();
        } catch (e) {}
      }
      if (els.video && els.video.srcObject) {
        try {
          els.video.srcObject.getTracks().forEach((t) => t.stop());
          els.video.srcObject = null;
        } catch (e) {}
      }
      els.videoContainer.style.display = "none";
      els.btnStopScan.style.display = "none";
    }

    function normalizeItem(raw) {
      if (!raw || typeof raw !== "object") return null;
      const name = String(raw.name || "").trim();
      const expiry = isValidDateString(raw.expiry) ? raw.expiry : addDaysToToday(14);
      if (!name) return null;
      return {
        id: String(raw.id || `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`),
        barcode: String(raw.barcode || "").trim(),
        name,
        categoryName: String(raw.categoryName || "Altro").trim() || "Altro",
        qty: Math.max(1, Math.floor(Number(raw.qty) || 1)),
        expiry
      };
    }

    function loadItems() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return memoryFallback.slice();
        const parsed = JSON.parse(raw);
        if (!Array.isArray(parsed)) return memoryFallback.slice();
        const cleaned = parsed.map(normalizeItem).filter(Boolean);
        memoryFallback = cleaned.slice();
        return cleaned;
      } catch {
        return memoryFallback.slice();
      }
    }

    function saveItems(items, successMessage = "") {
      const cleaned = items.map(normalizeItem).filter(Boolean);
      memoryFallback = cleaned.slice();
      let persisted = true;
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(cleaned));
      } catch (err) {
        persisted = false;
      }
      renderList();
      if (!persisted) {
        setStatus("Memoria permanente bloccata dal browser (es. navigazione privata). Dati tenuti nella sessione attuale.");
      } else if (successMessage) {
        setStatus(successMessage);
      }
    }

    function daysUntil(dateStr) {
      if (!isValidDateString(dateStr)) return 9999;
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const [y, m, d] = dateStr.split("-").map(Number);
      const target = new Date(y, m - 1, d);
      return Math.round((target.getTime() - today.getTime()) / (1000 * 60 * 60 * 24));
    }

    function setFilter(mode) {
      activeFilter = mode;
      els.filterAll.classList.toggle("active", mode === "all");
      els.filterUrgent.classList.toggle("active", mode === "urgent");
      renderList();
    }

    function renderList() {
      const allItems = loadItems().sort((a, b) => {
        const byExpiry = a.expiry.localeCompare(b.expiry);
        return byExpiry !== 0 ? byExpiry : a.name.localeCompare(b.name, "it");
      });

      const urgentCount = allItems.filter((item) => daysUntil(item.expiry) <= 3).length;

      els.filterAll.textContent = `Tutti (${allItems.length})`;
      els.filterUrgent.textContent = `In scadenza ≤ 3 gg (${urgentCount})`;

      const query = els.searchInput.value.trim().toLowerCase();

      const filtered = allItems.filter((item) => {
        const diff = daysUntil(item.expiry);
        if (activeFilter === "urgent" && diff > 3) return false;
        if (query) {
          const matchName = item.name.toLowerCase().includes(query);
          const matchCat = item.categoryName.toLowerCase().includes(query);
          const matchCode = (item.barcode || "").toLowerCase().includes(query);
          if (!matchName && !matchCat && !matchCode) return false;
        }
        return true;
      });

      if (!filtered.length) {
        els.list.innerHTML = allItems.length
          ? "<p class='subtitle'>Nessun prodotto corrisponde ai filtri selezionati.</p>"
          : "<p class='subtitle'>Nessun prodotto registrato in dispensa.</p>";
        return;
      }

      els.list.innerHTML = filtered.map((item) => {
        const diff = daysUntil(item.expiry);
        let cls = "";
        let label = `Scade tra ${diff} gg (${item.expiry})`;
        if (diff < 0) {
          cls = "expired";
          label = `Scaduto da ${Math.abs(diff)} gg (${item.expiry})`;
        } else if (diff <= 3) {
          cls = "soon";
          label = diff === 0 ? `Scade oggi (${item.expiry})` : `Scade tra ${diff} gg (${item.expiry})`;
        }

        return `
          <div class="item ${cls}">
            <div>
              <div class="item-title">${escapeHtml(item.name)} (x${item.qty})</div>
              <div class="item-meta">${escapeHtml(item.categoryName)} · ${label}</div>
            </div>
            <div class="actions">
              <button type="button" class="secondary small" onclick="changeQty('${escapeHtml(item.id)}', -1)">-1</button>
              <button type="button" class="danger small" onclick="deleteItem('${escapeHtml(item.id)}')">Elimina</button>
            </div>
          </div>
        `;
      }).join("");
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, (m) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[m]));
    }

    window.changeQty = function(id, delta) {
      const items = loadItems().map((item) => {
        if (item.id === id) {
          const nextQty = item.qty + delta;
          return nextQty > 0 ? { ...item, qty: nextQty } : null;
        }
        return item;
      }).filter(Boolean);
      saveItems(items);
    };

    window.deleteItem = function(id) {
      saveItems(loadItems().filter((item) => item.id !== id));
    };

    els.btnScan.addEventListener("click", startScanner);
    els.btnStopScan.addEventListener("click", stopScanner);
    els.category.addEventListener("change", updateEstimatedExpiry);
    els.barcode.addEventListener("change", () => {
      if (els.barcode.value.trim()) lookupBarcode(els.barcode.value);
    });
    els.searchInput.addEventListener("input", renderList);
    els.filterAll.addEventListener("click", () => setFilter("all"));
    els.filterUrgent.addEventListener("click", () => setFilter("urgent"));

    els.form.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (isScanning || isStartingScan) {
        await stopScanner();
      }

      const productName = els.name.value.trim();
      if (!productName) {
        setStatus("Inserisci un nome prodotto prima di salvare.");
        return;
      }

      const [categoryName] = els.category.value.split("|");
      const expiryValue = isValidDateString(els.expiry.value)
        ? els.expiry.value
        : addDaysToToday(getDaysForCategory());

      const newItem = normalizeItem({
        id: (typeof crypto !== "undefined" && crypto.randomUUID)
          ? crypto.randomUUID()
          : `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
        barcode: els.barcode.value.trim(),
        name: productName,
        categoryName,
        qty: Math.max(1, Math.floor(Number(els.qty.value) || 1)),
        expiry: expiryValue
      });

      const items = loadItems();
      items.push(newItem);

      const savedCategoryVal = els.category.value;
      els.form.reset();
      els.barcode.value = "";
      els.category.value = savedCategoryVal;
      els.qty.value = 1;
      updateEstimatedExpiry();

      saveItems(items, `Salvato: ${newItem.name}.`);
    });

    els.btnExport.addEventListener("click", () => {
      const blob = new Blob([JSON.stringify(loadItems(), null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `dispensa-backup-${formatLocalDate(new Date())}.json`;
      a.click();
      URL.revokeObjectURL(url);
    });

    els.btnImportTrigger.addEventListener("click", () => els.importFile.click());
    els.importFile.addEventListener("change", async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      try {
        const text = await file.text();
        const parsed = JSON.parse(text);
        if (Array.isArray(parsed)) {
          const validItems = parsed.map(normalizeItem).filter(Boolean);
          saveItems(validItems, `Backup importato (${validItems.length} prodotti).`);
        } else {
          setStatus("File di backup non valido.");
        }
      } catch {
        setStatus("File di backup non valido.");
      }
      e.target.value = "";
    });

    updateEstimatedExpiry();
    renderList();
  </script>
</body>
</html>
